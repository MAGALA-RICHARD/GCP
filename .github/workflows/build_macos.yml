name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    strategy:
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-13
            arch: x64

    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run Ruff
        run: |
          ruff check .
          ruff format --check .

      - name: Build macOS app
        run: pyinstaller --clean --noconfirm GCPPixelPicker-macos.spec

      - name: Package macOS app
        run: |
          ditto -c -k --sequesterRsrc --keepParent "dist/GCP Pixel Picker.app" "GCPPixelPicker-macOS-${{ matrix.arch }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCPPixelPicker-macOS-${{ matrix.arch }}
          path: GCPPixelPicker-macOS-${{ matrix.arch }}.zip

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GCPPixelPicker-macOS-${{ matrix.arch }}.zip
