name: Build macOS

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          brew install gdal
          export GDAL_CONFIG="$(brew --prefix gdal)/bin/gdal-config"
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build
        run: pyinstaller --clean --noconfirm GCPPixelPicker-macos.spec

      - name: Package
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "dist/GCP Pixel Picker.app" \
            "GCPPixelPicker-macOS-arm64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: GCPPixelPicker-macOS-arm64
          path: GCPPixelPicker-macOS-arm64.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: GCPPixelPicker-macOS-arm64.zip